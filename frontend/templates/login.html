{% extends "base.html" %}
{% block title %}Login — AutoML Laboratory{% endblock %}
{% block content %}
<div class="auth-page">
  <div class="auth-card">
    <div class="auth-brand">⚗</div>
    <h1 class="auth-title">Welcome Back</h1>
    <p class="auth-sub">Login to access your experiments</p>

    <div class="error-msg" id="auth-error" style="display:none"></div>

    <div class="form-group">
      <label class="form-label">Email</label>
      <input type="email" id="email" class="form-input" placeholder="you@example.com" />
    </div>
    <div class="form-group">
      <label class="form-label">Password</label>
      <input type="password" id="password" class="form-input" placeholder="••••••••" />
    </div>

    <button class="btn-auth" id="btn-login">Login →</button>

    <p class="auth-switch">Don't have an account? <a href="{{ url_for('signup') }}">Sign Up</a></p>
  </div>
</div>
<script>
document.getElementById('btn-login').addEventListener('click', async () => {
  const email    = document.getElementById('email').value.trim();
  const password = document.getElementById('password').value;
  const errEl    = document.getElementById('auth-error');
  errEl.style.display = 'none';
  if (!email || !password) { errEl.textContent = 'Please fill all fields.'; errEl.style.display = 'block'; return; }
  const btn = document.getElementById('btn-login');
  btn.disabled = true; btn.textContent = 'Logging in…';
  const res  = await fetch('/login', { method: 'POST', headers: {'Content-Type':'application/json'}, body: JSON.stringify({email, password}) });
  const data = await res.json();
  if (data.success) { window.location.href = '/app'; }
  else { errEl.textContent = data.error || 'Login failed.'; errEl.style.display = 'block'; btn.disabled = false; btn.textContent = 'Login →'; }
});
document.addEventListener('keydown', e => { if (e.key === 'Enter') document.getElementById('btn-login').click(); });
</script>
{% endblock %}
