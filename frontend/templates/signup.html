{% extends "base.html" %}
{% block title %}Sign Up — AutoML Laboratory{% endblock %}
{% block content %}
<div class="auth-page">
  <div class="auth-card">
    <div class="auth-brand"></div>
    <h1 class="auth-title">Create Account</h1>
    <p class="auth-sub">Start benchmarking AutoML frameworks</p>

    <div class="error-msg" id="auth-error" style="display:none"></div>

    <div class="form-group">
      <label class="form-label">Full Name</label>
      <input type="text" id="name" class="form-input" placeholder="Your name" />
    </div>
    <div class="form-group">
      <label class="form-label">Email</label>
      <input type="email" id="email" class="form-input" placeholder="you@example.com" />
    </div>
    <div class="form-group">
      <label class="form-label">College / Organization <span style="color:var(--muted)">(optional)</span></label>
      <input type="text" id="college" class="form-input" placeholder="e.g. IIT Delhi" />
    </div>
    <div class="form-group">
      <label class="form-label">Password</label>
      <input type="password" id="password" class="form-input" placeholder="Min 6 characters" />
    </div>

    <button class="btn-auth" id="btn-signup">Create Account →</button>
    <p class="auth-switch">Already have an account? <a href="{{ url_for('login') }}">Login</a></p>
  </div>
</div>
<script>
document.getElementById('btn-signup').addEventListener('click', async () => {
  const name = document.getElementById('name').value.trim();
  const email = document.getElementById('email').value.trim();
  const college = document.getElementById('college').value.trim();
  const password = document.getElementById('password').value;
  const errEl = document.getElementById('auth-error');
  errEl.style.display = 'none';
  if (!name || !email || !password) { errEl.textContent = 'Name, email and password are required.'; errEl.style.display = 'block'; return; }
  if (password.length < 6) { errEl.textContent = 'Password must be at least 6 characters.'; errEl.style.display = 'block'; return; }
  const btn = document.getElementById('btn-signup');
  btn.disabled = true; btn.textContent = 'Creating…';
  const res  = await fetch('/signup', { method: 'POST', headers: {'Content-Type':'application/json'}, body: JSON.stringify({name, email, password, college}) });
  const data = await res.json();
  if (data.success) { window.location.href = '/app'; }
  else { errEl.textContent = data.error || 'Signup failed.'; errEl.style.display = 'block'; btn.disabled = false; btn.textContent = 'Create Account →'; }
});
</script>
{% endblock %}
